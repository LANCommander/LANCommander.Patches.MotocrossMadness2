; mcm2patch for Motocross Madness 2 (MCM2.EXE 2.10 without SafeDisc). Install: copy dinput.dll, this file and the
; mcm2patch folder next to MCM2.EXE. The log goes to mcm2patch.log next to this file.
; 1 = on, 0 = off. Every option is on by default; set one to 0 to get the original behaviour back.
; Settings.ini in the save folder (see [Saves]; created on the first start) may hold any of these sections and keys
; too; its values win over this file (except for [Saves], which decides where that folder is).

[General]
; 0 = load, but patch nothing
Enabled=1

[Compat]
; What the Windows XP compatibility mode used to paper over (the game no longer needs it):
; report Windows XP SP3 to the game and its DirectDraw layer (Blade.dll)
WindowsVersion=1
; report at most 1 GB per memory figure: the game adds them up in 32 bits and warned about low memory on
; machines with 4 GB or more
MemoryStatus=1
; a failed DirectSound buffer lock (audio device change, another program taking the device) no longer crashes the
; engine sound (Access Violation at 0x4e9e0d)
SoundLock=1

[Registry]
; keep the game's settings (HKLM\Software\Microsoft\Microsoft Games\Motocross Madness 2) in [Game] and [Graphics]
; below instead of the registry. Install paths and the like are made up at every start, so the game folder can be
; moved. What the game measures on the 3-D card goes to VideoCards.bin in the save folder (measured again on
; another machine or set-up; delete the file to measure again)
UseFile=1
; log every registry access of the game (troubleshooting)
LogAccess=0

[Saves]
; profiles (ui\profile), replays and ghosts (Record), the replay being recorded (VCR*.dat) and the crash log in
; %USERPROFILE%\Saved Games\Microsoft\Motocross Madness 2 instead of the install folder. Existing profiles and
; records are copied over on the first start
Redirect=1
; use this folder instead (environment variables allowed, e.g. %APPDATA%\MCM2); empty = Saved Games
Folder=

[Profile]
; the player profile to load at start: created from ProfileTemplate if it does not exist yet (environment
; variables allowed, at most 15 characters). Empty = the game asks / uses the last profile
Name=

[Video]
; no "Please choose a 3-D card" dialog at start: the first hardware 3-D device is used
SkipDeviceDialog=1
; use this 3-D device (its number in the dialog's list, counting from 0); -1 = automatic
Device=-1
; with dgVoodoo 2: set in its dgVoodoo.conf what the game needs (full screen, 4:3 pictures pillarboxed, the race
; resolution decides the shape, the wide modes listed). The original file is kept as dgVoodoo.conf.mcm2patch.bak
ConfigureDgVoodoo=1
; clear the picture at the start of every race frame (to the fog colour). The game clears only the depth buffer and
; counts on the sky to cover the screen; where it does not, an older frame flickers through (behind the HUD, in the sky)
ClearScreen=1

[Movies]
; play the Indeo 5 movies (intro, menu background, credits) with the bundled decoder (mcm2patch\ir50.dll,
; FFmpeg, LGPL) installed for the game only. Without a decoder the movies are skipped instead of crashing
Decoder=1

[Widescreen]
; on a wide race resolution keep the 4:3 vertical view and show more at the sides (Hor+), instead of cutting off
; the top and bottom. The wide resolutions come from the video driver (with dgVoodoo 2: [Video] ConfigureDgVoodoo)
HorPlus=1
; the HUD (speedometer, radar, position panel, messages) and the in-race dialogs at the size they have at 640x480,
; scaled with the screen height and kept in their corners
ScaleHud=1

[Detail]
; how far away trees and bushes are still 3-D models, in percent of the original distance (100 = original; on the
; top Ecosystem setting the original is 150 units, so they turned from flat pictures into models just ahead of the
; bike). The models fade in over the outer part of that distance. More costs frame rate in wooded tracks
TreeDistance=300
; how far away the other models (riders, bikes, buildings, props) keep their detailed versions, in percent of the
; original distance (100 = original)
ModelDistance=200

[Framerate]
; time the game with the performance counter, to the microsecond: smooth motion at high refresh rates
PreciseTimer=1
; frame rate cap: 0 = the desktop refresh rate, -1 = no cap, or a number (frames per second)
MaxFps=0
; how often per second the computer riders decide how to steer and throttle (0 = every frame, the original). Above
; about 60 frames per second they weave and ride slowly; their bikes still move every frame
AiRate=60

[Gamepad]
; modern gamepads (Xbox, PlayStation, Switch Pro, ...) through SDL 2, offered to the game as joysticks:
; left stick steers and leans, A or RT accelerates, B or LT brakes, X / Y stunts. Pick the gamepad once in
; Options - Controls if the profile still uses the keyboard
UseSDL=1
; left stick dead zone, percent
Deadzone=10
; left stick steering response: 100 = linear (the bike steers in proportion to the stick), 50 = squared (finer near
; the centre), 0 = cubed. Full deflection is always full lock. (The game cubes a joystick's steering itself; the
; gamepad makes up for that, so this is the response the bike gets)
Sensitivity=50
; the game's force feedback as rumble (silent while the race is paused)
Rumble=1
; rumble strength, percent
RumbleStrength=100
; how much of the steady road force is felt (bumps come through in full), percent
RumbleSustain=25
; the triggers also press buttons 0 / 1 (accelerate / brake in the game's presets)
TriggerButtons=1
; the D-pad also steers and leans
DpadSteers=1
; hide a gamepad's own DirectInput entry, so it is not listed twice
HideDuplicates=1
; DirectInput device subtype reported to the game (2 = traditional joystick: analog steering)
Subtype=2
; gamepad slots offered to the game even when empty, for gamepads plugged in while it runs. 0 = only the
; gamepads connected at start (an empty slot becomes the profile's controller and leaves the keyboard unused)
Slots=0
; the keyboard key Start / Back press (DirectInput key codes; 1 = Escape, 14 = Backspace "back up"; 0 = none)
StartKey=1
BackKey=14

[Players]
; network games stay at 8 players (more is not done yet: the 8 is built into the multiplayer set-up and lobby)
MaxPlayers=8

[Debug]
; log crashes with registers and a call chain to mcm2patch.log
CrashLog=0

; The game's own settings, written by the game (with [Registry] UseFile=1). A key that is in Settings.ini is
; updated there instead.
; [Game]: MRUProfile (the profile loaded at start), UseVideoCardIdx, UseLastVideoCard, UseControllerId, ...
; [Graphics]: the quality switches for the 3-D card (per card, under DriverInfo, in the registry):
; TerrainDetailTextureMethod, Use8BitTextures, RenderFog, WaitForFlip, AllowTriLinear, AllowBiLinear, AllowMipMapping,
; AllowDither, TextureCacheLimit, VideoMemoryMB, ... (1 = on, 0 = off)
[Game]

[Graphics]
