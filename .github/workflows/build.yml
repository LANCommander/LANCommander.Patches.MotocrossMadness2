# Builds on every push and pull request. A semver tag (v1.2.3, v1.2.3-rc.1) also queues up a draft GitHub
# release with the three packages attached (dinput.dll, ASI, LANCommander Interposer plugin); publish it from
# the Releases page.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc mingw-w64-i686-SDL2 make diffutils pkgconf zip

      # the FFmpeg build behind the Indeo 5 decoder only changes with build_ir50.sh
      - uses: actions/cache@v4
        with:
          path: third_party
          key: ffmpeg-${{ hashFiles('build_ir50.sh') }}

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' \
              || { echo "::error::$GITHUB_REF_NAME is not a semver tag (vMAJOR.MINOR.PATCH)"; exit 1; }
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: MCM_VERSION="$VERSION" sh build.sh

      - name: Package
        run: |
          mkdir -p out/dinput/mcm2patch out/asi/mcm2patch out/interposer/.interposer/Plugins out/interposer/mcm2patch
          cp build/dinput.dll dist/mcm2patch.ini out/dinput/
          cp build/mcm2patch.asi dist/mcm2patch.ini out/asi/
          cp build/LANCommander.Interposer.Plugin.MotocrossMadness2.dll out/interposer/.interposer/Plugins/
          for d in dinput asi interposer; do
            cp build/mcm2patch/ir50.dll out/$d/mcm2patch/
            cp src/ir50/README.md out/$d/mcm2patch/ir50-README.md
            cp third_party/ffmpeg-src/ffmpeg-*/COPYING.LGPLv2.1 out/$d/mcm2patch/ir50-COPYING.LGPLv2.1.txt
            cp LICENSE out/$d/mcm2patch/LICENSE.txt
            cp README.md out/$d/mcm2patch/README.md
          done
          (cd out/dinput && zip -qr "../mcm2patch-$VERSION-dinput.zip" .)
          (cd out/asi && zip -qr "../mcm2patch-$VERSION-asi.zip" .)
          (cd out/interposer && zip -qr "../LANCommander.Interposer.Plugin.MotocrossMadness2-$VERSION.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: mcm2patch-${{ env.VERSION }}
          path: out/*.zip

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--draft"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/*.zip --title "$GITHUB_REF_NAME" --generate-notes $flags
